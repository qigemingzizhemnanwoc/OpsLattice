spring.application.name=back
server.port=8080
server.servlet.context-path=/api
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
mybatis-plus.mapper-locations=classpath:mapper/**/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.logic-delete-field=isDeleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0
mybatis-plus.global-config.db-config.id-type=auto
sa-token.token-name=Authorization
sa-token.token-prefix=Bearer
sa-token.timeout=86400
sa-token.is-log=false
app.upload.base-path=/app/uploads
app.cors.allowed-origin-patterns=http://localhost:18080
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
knife4j.enable=false
app.container-bootstrap=true
